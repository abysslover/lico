[project]
name = "lico-measure"
version = "0.0.0"
description = "Measurement tooling for the Lico architecture experiment"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The daily run leaves out the acceptance group (the clean-clone build); it has its own command: `python -m lico_measure.suite acceptance`.
addopts = "-m 'not acceptance'"
markers = [
    "acceptance: proves a property of the build recipe or of a publication, not of every source edit; run when the recipe files change, at the end of a phase and before a publication",
]
