[project]
name = "lico-measure"
version = "0.0.0"
description = "Measurement tooling for the Lico architecture experiment"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The daily run leaves out the acceptance group (the clean-clone build) and the retired prototypes; each has its own command:
# `python -m lico_measure.suite acceptance` and `python -m lico_measure.suite legacy`.
addopts = "-m 'not acceptance and not legacy_candidates'"
markers = [
    "acceptance: proves a property of the build recipe or of a publication, not of every source edit; run when the recipe files change, at the end of a phase and before a publication",
    "legacy_candidates: runs a retired prototype (candidate clients a b c c2 d, the host prototypes rust_std rust_serde c) against the product's protocol; run on demand, never in the daily run",
]
