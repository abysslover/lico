# The workspace (M15-P02): the `lico` program (one executable) and the tools of the component rules. Components (M15-P03 on) join as `components/<name>` members.
# Profiles are read from here only: they are the ones the program has always been built with.
[workspace]
resolver = "2"
members = ["components/convo", "components/ws", "components/proxy", "components/engine",
    "components/memguard", "components/browser-view", "components/frame", "components/sandbox", "components/cdp", "components/cdp-fake", "components/llm-fake", "components/llm-http", "components/llm-wire", "components/toolloop", "components/png", "components/vt", "src/host/hostd", "tools/xtask", "tools/fake-engine"]

[profile.release]
opt-level = 2
debug = false
lto = false
codegen-units = 16
panic = "abort"
strip = true

# The unit tests' binary is linked with rust-lld, which held 1.07 GiB for the full debug information (the suite's build peaked at 1.5 GiB on every rebuild): the lines are kept, so a failing test still names the file and line.
[profile.dev]
debug = "line-tables-only"

# The unit tests shape and draw thousands of lines (the fonts differential): the text libraries run at the speed of the product, the program itself is unchanged.
[profile.dev.package.cosmic-text]
opt-level = 2
[profile.dev.package.harfrust]
opt-level = 2
[profile.dev.package.read-fonts]
opt-level = 2
[profile.dev.package.skrifa]
opt-level = 2
[profile.dev.package.swash]
opt-level = 2
[profile.dev.package.ttf-parser]
opt-level = 2
[profile.dev.package.fontdb]
opt-level = 2
[profile.dev.package.zeno]
opt-level = 2
