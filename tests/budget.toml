# The time and memory a test run may take. Read by `python -m lico_measure.suite run`; a broken budget makes the run exit 3.
# A test over `default_s` needs an entry below with a reason; the summary names every test over its budget.

default_s = 15          # wall seconds of one test (setup + call + teardown)
cold_run_s = 180        # the whole suite, nothing skipped by receipt, build not counted
peak_rss_mib = 1536     # all workers together (resident sets of the whole process tree, shared pages counted once per process); the tests and the build are judged apart. Lowered from 2048 on 2026-11-19 (M23-P03a): measured 1161 for the tests and 1176 for the build, a run went over 2000 before the causes were fixed

# No test has an entry now (M23-P03b): the longest in the cold run is 11.5 s, and the guard's own tests no longer wait for real minutes (the host takes the quiet time after typing from LICO_GUARD_TYPING_QUIET_MS, the stall time from the owner's memory.json).
# An entry looks like:
#   [[allow]]
#   test = "tests/test_x.py::test_name"      (a prefix of the node id)
#   seconds = 30
#   reason = "why this one test cannot be quicker"
