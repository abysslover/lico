tests = ["tests/test_mark_table.py"]
reason = "the Rust table of the opening brackets and quotes, generated: the test reads it by path and compares it with its Python mirror and with the generator"

[[sources]]
glob = "tests/fixtures/provider_text.json"
tests = ["tests/test_reference_mapping.py", "tests/test_forged_leads.py"]
cargo = ["leads::"]
reason = "a line of agent text and the record it becomes: the reference mapping reads it in its Python test, the built program in test_forged_leads, the host rule in a unit test of leads.rs (include_str!)"

[[sources]]
glob = "src/host/adapters/codex/**"
tests = ["tests/test_codex_adapter.py"]
reason = "the simulator of the Codex app server and its capabilities, started by path"

[[sources]]
glob = "src/host/adapters/claude/**"
tests = ["tests/test_claude_adapter.py"]
reason = "the simulator of the Claude stream and its capabilities, started by path"

[[sources]]
glob = "src/lico_host/**"
tests = ["tests/test_protocol_conformance.py"]
reason = "the reference host in Python, run as `python -m lico_host` by the conformance test"

[[sources]]
glob = "src/host/rust/**"
tests = ["tests/test_protocol_conformance.py"]
reason = "a second Rust host, built and run by the conformance test when present"

[[sources]]
glob = "src/host/c/**"
tests = ["tests/test_protocol_conformance.py"]
reason = "the host in C, built and run by the conformance test when present"

[[inert]]
glob = "**/*.md"
reason = "documents"

[[inert]]
