[rust.modules]
# The area in which each top-level module's own code runs. Users of a module (`crate::name`) are added when it changes.
accounts = ["host"]
admin = ["host"]
bin = ["synth"]           # src/bin/synth_agent.rs: the agent test double
broker = ["host"]
call_room = ["host"]
calls = ["host"]
capture = ["cli"]
clipboard = ["cli", "gui"]     # the command (cli) and the safe open the window uses for a picture file (gui)
clipwrite = ["host"]
pasted = ["host"]
screentools = ["host"]     # the agent tools capture, clipboard_read and clipboard_write (S07a); runs in the host
vdisplay = ["cli", "host"]
claude = ["host"]
cli = ["cli"]
codex = ["host"]
computer = ["cli", "host"]
core = ["host"]
create = ["host"]
credcmd = ["cred"]
creds = ["cred"]
dbus = ["cred"]
echo = ["host"]
folders = ["host"]
fsview = ["host"]
helper = ["host"]
gui = ["gui"]
handoff = ["host"]
history = ["host"]
host = ["host"]
http = ["host"]
ident = ["cli", "gui"]
inbox_read = ["host"]
ipc = ["host"]
keyring = ["cred"]
leads = ["host"]
lifecycle = ["host"]
lines = ["host"]
login = ["host"]
marks = ["host"]
mcp = ["host"]
memory = ["host"]
mention = ["host"]
notify = ["host"]
past = ["host"]
payload = ["host"]
pending = ["host"]
png = ["host"]
provider_record = ["host"]
quota = ["host"]
registry = ["host"]
search = ["host"]
session = ["host"]
ssh = ["host"]
ssh_remote = ["host"]
tokens = ["host"]
tools = ["host"]
transfer = ["host"]
worktree = ["gui", "host"]
xjob = ["cli"]
unified = ["*"]           # the dispatch: every role goes through it

[rust]
# Files that change the binary itself, whatever the module: every test that starts it, and the whole `cargo test --bin lico`.
everything = [
    "src/host/hostd/Cargo.toml",
    "src/host/hostd/Cargo.lock",
    "src/host/hostd/build-release.sh",
    "src/host/hostd/build.rs",          # bakes the commit into the binary
    "src/host/hostd/NOTICES.txt",       # printed by `lico licenses`, compiled in
    "LICENSE",                          # printed by `lico licenses`, compiled in
]

[acceptance]
# Test files whose every test is marked `acceptance` or `legacy_candidates`: the daily run collects nothing from them (pytest rc 5),
# and only for these files is that a pass - anywhere else a file that collects nothing fails the run. None today.
only = []

# The clean-clone build (tests/test_single_executable.py, mark `acceptance`, 80 s, 3.5 GiB) is due when one of these changes, and
# before a merge or a release. Run it with: python -m lico_measure.suite acceptance
triggers = [
    "src/host/hostd/Cargo.toml",
    "src/host/hostd/Cargo.lock",
    "src/host/hostd/build-release.sh",
    "src/host/hostd/build.rs",
    "src/host/hostd/NOTICES.txt",
    "LICENSE",
    ".gitignore",
    "tests/test_single_executable.py",
]

[always]
# Guards that read the whole tree: cheap (a file read each), so they run for every change that is not inert, and their receipt
# names every source and test file.
tests = ["tests/test_size_ratchet.py"]

[everywhere]
# No tracked text file holds a character that draws as nothing or as something else (tests/test_no_hidden_characters.py).
tests = ["tests/test_no_hidden_characters.py"]

[[sources]]
glob = "src/host/hostd/build.rs"
tests = ["tests/test_build_commit.py"]
reason = "the build script that bakes the commit in: the test compiles it alone and runs it in throw-away repositories"

[[sources]]
glob = "tests/testmap.toml"
tests = ["tests/test_selection.py"]
reason = "the map is checked against the tree by the selection test"

[[sources]]
glob = "tests/budget.toml"
tests = ["tests/test_selection.py"]
reason = "the budget table is checked by the selection test and read by the runner"

[[sources]]
glob = "tests/size_allowlist.toml"
tests = ["tests/test_size_ratchet.py"]
reason = "the allowlist of the size ratchet"

[[sources]]
glob = "tests/fixtures/model_names.json"
tests = ["tests/test_model_names.py"]
cargo = ["folders::"]
reason = "the table of model names: the protocol rule reads it in the Python test, the host rule in a unit test of folders.rs (include_str!)"

[[sources]]
glob = "tests/fixtures/text_rules.json"
tests = ["tests/test_text_rules.py"]
cargo = ["folders::"]
reason = "what a name, a folder path and an input text may hold: the protocol rule reads it in the Python test, the host rules in a unit test of folders.rs (include_str!)"

[[sources]]
glob = "tests/fixtures/claude_record/*.jsonl"
tests = ["tests/test_conversation.py"]
cargo = ["provider_record::"]
reason = "records of the real program, scrubbed: the Rust reader takes them in a unit test (include_str!), the hand-over through the protocol library in test_conversation"

[[sources]]
glob = "src/host/hostd/src/marks/table.rs"
tests = ["tests/test_mark_table.py"]
reason = "the Rust table of the marks, generated: the test reads it by path and compares it with its Python mirror and with the generator"

[[sources]]
