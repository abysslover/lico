# The short named list of system tests (M16-P06). Each needs a real process boundary that no component test has; the budget of every one is at most 512 MiB and 60 s.
# `cargo xtask system --record` writes the measured peak and time (of the last passing run) next to each test.

[[test]]
name = "local_message_streams_into_the_log"
path = "local::system_tests::a_message_through_a_local_session_streams_lines_into_the_log"
why = "needs the real host binary, its socket, its registry and its log: a message of the person reaches a local session through the operation `input`, the answer streams into the log as lines and the conversation record is written"
mib = 512
seconds = 60
measured_mib = "19.1"
measured_seconds = "0.1"

[[test]]
name = "local_tool_card_waits_and_resumes"
path = "local::system_tests::a_tool_that_needs_a_card_waits_the_person_allows_and_the_answer_ends"
why = "needs the real host: the approval card of a tool call is answered through the operation `approval.answer`, and the host's message about the decision starts the next turn of the local session"
mib = 512
seconds = 60
measured_mib = "20.2"
measured_seconds = "0.2"

[[test]]
name = "local_stop_cancels_a_stream"
path = "local::system_tests::a_stop_cancels_a_running_stream_within_about_a_second"
why = "needs the real host: `session.close` must end a running model stream through the open connection while the host keeps serving"
mib = 512
seconds = 60
measured_mib = "19.3"
measured_seconds = "0.4"

[[test]]
name = "local_server_vanishes_and_recovers"
path = "local::system_tests::a_server_that_vanishes_is_said_so_and_the_session_recovers_on_the_next_message"
why = "needs the real host: a model server that goes away is said so in the log, and the session works again on the next message without a restart"
mib = 512
seconds = 60
measured_mib = "19.9"
measured_seconds = "0.2"

[[test]]
name = "browser_tab_opens_and_paints_a_fake_frame"
path = "browser::system_tests::browser_tab_opens_and_paints_a_fake_frame"
why = "needs the real host binary and a real child process behind the fence and the fetch guard (a fake engine program): a tab is opened, the engine's frame is painted and written as a picture, the guard's refusal reaches the tab as a notice, and the socket and POST /v1 answer the same"
mib = 512
seconds = 60
measured_mib = "27.4"
measured_seconds = "0.5"

[[test]]
name = "browser_engine_ends_with_the_last_tab_and_never_starts_without_one"
path = "browser::system_tests::browser_engine_ends_with_the_last_tab_and_never_starts_without_one"
why = "needs the real process boundary: no engine process, scratch directory or thread without a tab, one engine for all tabs, the last close and a host stop end it and clean up, a killed engine is shown in its tabs and restarted by the next action, and the tab cap holds"
mib = 512
seconds = 60
measured_mib = "23.5"
measured_seconds = "1.9"

[[test]]
name = "browser_watch_hands_the_window_the_newest_frame_and_nothing_polls"
path = "browser::system_tests::browser_watch_hands_the_window_the_newest_frame_and_nothing_polls"
why = "needs the real host and a real engine process: a burst of frames from an animated page leaves the host with the newest and a count of the rest, one blocking watch per tab wakes only on a change, a newer watch releases the older, and a window that vanishes and comes back leaves no thread behind"
mib = 512
seconds = 60
measured_mib = "22.8"
measured_seconds = "2.8"

[[test]]
name = "browser_input_reaches_the_engine_at_once_and_nothing_wakes_while_a_still_page_is_shown"
path = "browser::system_tests::browser_input_reaches_the_engine_at_once_and_nothing_wakes_while_a_still_page_is_shown"
why = "needs the real host and a real engine process: a press, a wheel step, a key and committed Korean text reach the engine in the order given, a command is written to the engine in under 20 ms at the 95th percentile, a hidden tab takes no input, and the host's threads do not wake while a still page is shown"
mib = 512
seconds = 60
measured_mib = "24.4"
measured_seconds = "23.2"

[[test]]
name = "browser_engine_installs_itself"
path = "browser::system_tests::browser_engine_installs_itself_when_a_tab_is_opened_and_runs"
why = "needs the real host binary built with the test seam and the real `curl` and `tar`: a tab opened with no engine says it is installing, the command waits, the pinned-hash check passes on the file from a local fake release server, the engine is moved into place, started and paints; the second tab asks the server for nothing"
mib = 512
seconds = 60
measured_mib = "29.4"
measured_seconds = "0.5"
