[package]
name = "lico-host"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[features]
serde = ["dep:serde_json"]

[dependencies]
serde_json = { version = "=1.0.154", optional = true, default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
