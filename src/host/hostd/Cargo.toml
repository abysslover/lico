[package]
name = "lico"
version = "0.5.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

# One program with several roles: the session host, the command line, the credential command and
# the primary client are subcommands of `lico` (or run by the name they are linked under).
[[bin]]
name = "lico"
path = "src/unified.rs"

# A test double for an agent; never part of the shipped program.
[[bin]]
name = "lico-synth-agent"
path = "src/bin/synth_agent.rs"

[features]
# Test builds only (`cargo xtask system`): a host that takes the engine's release address and hashes from a file named by a variable. The release build has no such code.
install_seam = []

[dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
cosmic-text = "=0.19.0"
unicode-linebreak = "=0.1.5"
x11rb = { version = "=0.13.2", default-features = false, features = ["xtest"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
lico-png = { path = "../../../components/png" }
lico-llm-wire = { path = "../../../components/llm-wire" }
lico-llm-http = { path = "../../../components/llm-http" }
lico-convo = { path = "../../../components/convo" }
lico-toolloop = { path = "../../../components/toolloop" }
lico-cdp = { path = "../../../components/cdp" }
lico-sandbox = { path = "../../../components/sandbox" }
lico-proxy = { path = "../../../components/proxy" }
lico-browser-view = { path = "../../../components/browser-view" }
lico-engine-pack = { path = "../../../components/engine-pack" }
lico-frame = { path = "../../../components/frame" }

[dev-dependencies]
lico-png = { path = "../../../components/png", features = ["testing"] }
lico-llm-fake = { path = "../../../components/llm-fake" }
