[package]
name = "lico-candidate-a2"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
cosmic-text = "=0.19.0"
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

[profile.release]
opt-level = 2
lto = false
debug = false
