[package]
name = "lico-convo"
version = "0.1.0"
edition = "2021"
description = "The conversation record of one local session (an owner-only JSONL file) and the choice of how much of it fits a context window."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
lico-llm-wire = { path = "../llm-wire" }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

[package.metadata.lico]
purpose = "The conversation record of one local session on disk (owner-only, append-only JSON lines, a torn last line repaired) and the choice of how much of it fits a context window by whole turns."
spec = "SPEC.md"
depends = ["lico-llm-wire"]
external = []
budget = { mib = 256, seconds = 30 }
