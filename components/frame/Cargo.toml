[package]
name = "lico-frame"
version = "0.2.0"
edition = "2021"
description = "A bounded decoder of PNG and baseline JPEG for the frames of a browser tab: PNG colour types 0, 2, 3, 4 and 6 at 8 and 16 bits, no interlacing; JPEG baseline and extended sequential, grey or YCbCr, any plain sampling, restart intervals; every size checked from the header before anything is allocated."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# The tests decode what the PNG writer of the program makes (real LZ77 and Huffman coding): an input of the tests, not a dependency.
lico-png = { path = "../png" }

[package.metadata.lico]
purpose = "A bounded decoder of PNG and baseline JPEG for the frames of a browser tab: PNG colour types 0, 2, 3, 4 and 6 at 8 and 16 bits (every chunk CRC and the zlib checksum checked); JPEG baseline and extended sequential Huffman, grey or YCbCr, the pixels of libjpeg; and the size of the output checked from the header before anything is allocated."
spec = "SPEC.md"
depends = []
external = []
budget = { mib = 256, seconds = 30 }
