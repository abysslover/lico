[package]
name = "lico-frame"
version = "0.1.0"
edition = "2021"
description = "A bounded PNG decoder for the frames of a browser tab: 8 and 16 bit colour types 0, 2, 3, 4 and 6, no interlacing, chunk CRCs and the zlib checksum checked, the output size checked before anything is allocated."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# The tests decode what the PNG writer of the program makes (real LZ77 and Huffman coding): an input of the tests, not a dependency.
lico-png = { path = "../png" }

[package.metadata.lico]
purpose = "A bounded PNG decoder for the frames of a browser tab: the colour types 0, 2, 3, 4 and 6 at 8 and 16 bits, no interlacing, every chunk CRC and the zlib checksum checked, and the size of the output checked from the header before anything is allocated."
spec = "SPEC.md"
depends = []
external = []
budget = { mib = 256, seconds = 30 }
